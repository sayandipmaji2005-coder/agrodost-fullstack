<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlowRec" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#14261b"/>
      <stop offset="100%" stop-color="#09140d"/>
    </radialGradient>
    <radialGradient id="leafGradRec" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#5bb574"/>
      <stop offset="45%" stop-color="#3b8a53"/>
      <stop offset="85%" stop-color="#245c36"/>
      <stop offset="100%" stop-color="#173d24"/>
    </radialGradient>
    <radialGradient id="healedScar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a3e30"/>
      <stop offset="55%" stop-color="#736350"/>
      <stop offset="85%" stop-color="#558060"/>
      <stop offset="100%" stop-color="#5bb574" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="800" height="600" fill="url(#bgGlowRec)"/>

  <!-- Vibrant Healed Leaf Shape -->
  <path d="M 400 45 C 590 105, 710 290, 585 480 C 490 575, 330 575, 230 480 C 95 295, 210 105, 400 45 Z" fill="url(#leafGradRec)" stroke="#1a4729" stroke-width="4"/>
  
  <!-- Primary Midrib Vein (Healthy Light Green) -->
  <path d="M 400 50 Q 396 280 400 550" stroke="#9de3af" stroke-width="7" stroke-linecap="round" fill="none"/>
  
  <!-- Lateral Veins -->
  <path d="M 398 150 Q 480 190 560 210" stroke="#7ac990" stroke-width="3.5" fill="none"/>
  <path d="M 398 230 Q 500 280 595 320" stroke="#7ac990" stroke-width="3.5" fill="none"/>
  <path d="M 398 330 Q 480 390 545 450" stroke="#7ac990" stroke-width="3" fill="none"/>
  
  <path d="M 398 170 Q 320 210 240 230" stroke="#7ac990" stroke-width="3.5" fill="none"/>
  <path d="M 398 260 Q 300 310 205 350" stroke="#7ac990" stroke-width="3.5" fill="none"/>
  <path d="M 398 360 Q 320 420 260 480" stroke="#7ac990" stroke-width="3" fill="none"/>

  <!-- Desiccated / Inactive Callus Borders (Fungus Eradicated, Tissue Healed) -->
  <ellipse cx="485" cy="275" rx="55" ry="48" fill="url(#healedScar)"/>
  <ellipse cx="275" cy="355" rx="42" ry="38" fill="url(#healedScar)"/>
  <ellipse cx="430" cy="425" rx="30" ry="22" fill="url(#healedScar)"/>

  <!-- Healing Sparkle Accents -->
  <path d="M 485 240 L 488 250 L 498 253 L 488 256 L 485 266 L 482 256 L 472 253 L 482 250 Z" fill="#86efac" opacity="0.9"/>
  <path d="M 275 320 L 278 328 L 286 331 L 278 334 L 275 342 L 272 334 L 264 331 L 272 328 Z" fill="#86efac" opacity="0.9"/>

  <!-- Status Chip Overlay -->
  <g transform="translate(30, 30)">
    <rect width="280" height="38" rx="10" fill="rgba(6, 78, 59, 0.85)" stroke="rgba(52, 211, 153, 0.5)" stroke-width="1.5"/>
    <circle cx="22" cy="19" r="6" fill="#10b981"/>
    <text x="36" y="24" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Day 7 Check: Callus Healed</text>
  </g>
</svg>
