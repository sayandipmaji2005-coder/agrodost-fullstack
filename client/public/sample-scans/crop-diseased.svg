<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e2920"/>
      <stop offset="100%" stop-color="#0d140e"/>
    </radialGradient>
    <radialGradient id="leafGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4a7c59"/>
      <stop offset="45%" stop-color="#2d5a3f"/>
      <stop offset="85%" stop-color="#1c3d27"/>
      <stop offset="100%" stop-color="#12281a"/>
    </radialGradient>
    <radialGradient id="lesionMain" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#21130a"/>
      <stop offset="35%" stop-color="#3d2112"/>
      <stop offset="65%" stop-color="#734726"/>
      <stop offset="85%" stop-color="#b89c44"/>
      <stop offset="100%" stop-color="#3d6349" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lesionSec" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#28160c"/>
      <stop offset="40%" stop-color="#4d2c16"/>
      <stop offset="70%" stop-color="#8c582e"/>
      <stop offset="90%" stop-color="#c9ab4b"/>
      <stop offset="100%" stop-color="#2d5a3f" stop-opacity="0"/>
    </radialGradient>
    <filter id="mildewTexture" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="4" result="noise"/>
      <feColorMatrix type="matrix" values="1 0 0 0 0.9  0 1 0 0 0.95  0 0 1 0 0.9  0 0 0 0.5 0" in="noise" result="fungalMold"/>
      <feComposite operator="in" in="fungalMold" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="800" height="600" fill="url(#bgGlow)"/>

  <!-- Leaf Shape with Natural Contours -->
  <path d="M 400 45 C 590 105, 710 290, 585 480 C 490 575, 330 575, 230 480 C 95 295, 210 105, 400 45 Z" fill="url(#leafGrad)" stroke="#162e1d" stroke-width="4"/>
  
  <!-- Primary Midrib Vein -->
  <path d="M 400 50 Q 396 280 400 550" stroke="#7ac48d" stroke-width="7" stroke-linecap="round" fill="none"/>
  
  <!-- Lateral Veins -->
  <path d="M 398 150 Q 480 190 560 210" stroke="#5fa671" stroke-width="3.5" fill="none"/>
  <path d="M 398 230 Q 500 280 595 320" stroke="#5fa671" stroke-width="3.5" fill="none"/>
  <path d="M 398 330 Q 480 390 545 450" stroke="#5fa671" stroke-width="3" fill="none"/>
  
  <path d="M 398 170 Q 320 210 240 230" stroke="#5fa671" stroke-width="3.5" fill="none"/>
  <path d="M 398 260 Q 300 310 205 350" stroke="#5fa671" stroke-width="3.5" fill="none"/>
  <path d="M 398 360 Q 320 420 260 480" stroke="#5fa671" stroke-width="3" fill="none"/>

  <!-- Active Necrotic Lesions (Late Blight / Fungal Spot) -->
  <ellipse cx="485" cy="275" rx="100" ry="85" fill="url(#lesionMain)"/>
  <ellipse cx="275" cy="355" rx="80" ry="70" fill="url(#lesionSec)"/>
  <ellipse cx="430" cy="425" rx="65" ry="45" fill="url(#lesionMain)"/>
  <ellipse cx="340" cy="180" rx="45" ry="35" fill="url(#lesionSec)"/>

  <!-- White Sporangial Mold / Downy Mildew at Lesion Margins -->
  <ellipse cx="505" cy="265" rx="75" ry="60" filter="url(#mildewTexture)"/>
  <circle cx="270" cy="345" r="50" filter="url(#mildewTexture)"/>

  <!-- Status Chip Overlay -->
  <g transform="translate(30, 30)">
    <rect width="260" height="38" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(244, 63, 94, 0.4)" stroke-width="1.5"/>
    <circle cx="22" cy="19" r="6" fill="#f43f5e"/>
    <text x="36" y="24" fill="#fda4af" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Baseline Scan: Active Blight</text>
  </g>
</svg>
